; It's a me! - this mod's own settings, kept beside the mod.  wiimote.ini is the platform's file and has nothing
; about Mario in it: turning this mod on in the launcher is what turns him on, and everything he needs is here.
;
; THE ROM.  Mario's textures, animations and music are read from your own Super Mario 64 (USA) ROM while you play -
; nothing of it is part of this mod.  Either drop the .z64 into this folder (any name; the first one found is
; used), or give its full path here.  A path here wins over the folder, so leave it empty when the ROM sits
; beside this file:
rom=

; The music a level plays while Mario has it - SM64's own sequence player, so it loops the way it does there.
; 0 = off and the game keeps its own. 03 Bob-omb Battlefield, 04 inside the castle, 05 Dire Dire Docks,
; 06 Lethal Lava Land, 07 Bowser, 08 Cool Cool Mountain, 09 the slide, 0A Big Boo's Haunt, 0C Hazy Maze Cave,
; 11 Koopa's Road, 13 the merry-go-round, 16 a boss, 19 the final Bowser
music=3
music_volume=100

; Which channels of that music are the water (the two string layers), and which are never to be heard at all
; (the drums on 9, 10 and 11, and the low part on 6).  Bit 0 is channel 0.
water_channels=0x0003
music_mute=0x0E40

; Mix groups of the game's own sound silenced while Mario has the level: 24 is the rabbids' own voices, so the
; level keeps its noises and they keep quiet.
silence_groups=24

; 1 = libsm64's own messages in wiimote_log.txt.  It is chatty and costs frames: leave it off unless something
; is wrong.
log=0

; A file to write Mario's audio into as raw PCM, for looking at what the music is doing.  Empty = off.
audio_dump=

; The crash hunt.  1 = every block libsm64's renderer and objects allocate ends at a page nobody may touch, so a
; write past its end is a crash at the very line that did it (logged, with a minidump).  2 = the heaps are checked
; at each phase of a step and the first corruption is logged with where it was seen.  4 = also before each
; object's behaviour, naming the object (slow).  Add them up; 0 = off.
debug=0
