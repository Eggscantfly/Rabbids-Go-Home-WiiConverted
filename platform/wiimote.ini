; wiimote.ini - virtual Wii remote + Nunchuk and Wii save layer for the Rabbids Go Home PC executable.
; Put this file next to wiimote.dll.  Missing keys use the defaults shown here.
;
; Keyboard/mouse names: A..Z 0..9 F1..F24 SPACE RETURN TAB ESCAPE BACK LSHIFT RSHIFT LCONTROL RCONTROL
;   LMENU (left Alt) RMENU UP DOWN LEFT RIGHT HOME END PRIOR NEXT INSERT DELETE NUMPAD0..NUMPAD9
;   LBUTTON RBUTTON MBUTTON XBUTTON1 XBUTTON2, or a virtual-key code such as 0x41.  Several: comma list.
; XInput names: A B X Y LB RB LT RT BACK START LS RS DUP DDOWN DLEFT DRIGHT
; An empty value removes the binding.

[general]
; 0 = the DLL does nothing (the engine sees no Wii remote)
enabled=1
; 1 = write wiimote_log.txt next to the DLL; log_verbose adds a state line every 2 s
log=0
log_verbose=0
; 1 = when the game's main thread finishes no frame for 4 s, the log shows where it is (registers and the return
;     addresses on its stack); needs log=1
hang_watch=1
; 1 = a crash (an access violation or the like, on any thread) is logged with where it happened, the registers and
;     the return addresses on that thread's stack, and a minidump crash_<time>.dmp is written beside the log; needs
;     log=1
crash_log=1
; Wii remote channel 0..3 (script controller id 20 + channel)
channel=0
nunchuk=1
; the engine's WPAD client always connects to 127.0.0.1:4242
port=4242
rate_hz=200
; read keyboard, mouse and pad only while a window of the game has the focus
require_focus=1
; 1 = also report the remote through the WrapKPAD* exports (Gear::Input::GamePadWii, ignored by the game)
gear_pad=0
; forward Wii remote rumble to the XInput pad
rumble=1
connect_at_start=1

[save]
; 1 = the Wii save natives (SAV_*) work on save files in the "sav" folder next to the game executable
; 0 = the engine is left untouched (the PC stubs: the profile page crashes)
enabled=1
; 1 = behave like a Wii with the Rabbids Channel installed (no install prompt); 0 = show the prompts
channel_installed=1

[controls]
; wii = the virtual Wii remote + Nunchuk configured by [general] [pointer] [motion] [keys] [xinput]
; pc  = PC-native controls (the default): no virtual remote at all; the scripts read the keyboard, mouse and pad
;       through the bindings of the Options screen (options.ini), the Wii pointer natives follow the mouse inside the
;       game viewport at the distance [pointer] dist, and the shake / tilt actions of the bindings move the remote
;       the Wii-only parts of the game read.
mode=pc

[video]
; 1 = the Wii video natives that are empty stubs in the PC executable work like on the Wii: K3D_BinkIsRunning,
;     K3D_BinkPause/Stop/Goto/LengthGetCurrentVideo, K3D_BinkPreload, IsPreloading, IsPreloadFinished,
;     GetPreloadedBinkKey, CancelPreload.  0 = the engine's stubs
natives=1
; 1 = log every video played (frames shown and skipped, wall time, time factor) and every video script call
;     (needs log=1 in [general])
log=0
; 1 = draw the Wii after effects of the levels (the colour grade, the soft glow and the tint the Wii executable puts
;     over the 3D image; the PC executable skips them).  0 = the PC look
afx=1
; 1 = save the frame before and after the effects as afx_NN_before.png / afx_NN_after.png next to the DLL each time
;     the effect settings change (at most once a second; 20 pairs, or N pairs with afx_dump=N)
afx_dump=0

[timing]
; frame rate cap in Hz, waited inside the engine's frame time so the game's DT follows it (the Wii runs at 60 Hz;
; 59.94 gives NTSC exactly).  0 = off: the PC executable runs uncapped (DT ~1 ms)
fps_cap=60

[audio]
; 1 = sound sets that play their sounds one after the other (the taxi's horn, engine start and engine loop in hub 3)
;     keep each sound's decoded audio from the level load.  0 = the engine's behavior: it decodes them again after
;     the load from the wrong place (the start of the sound BF): silence or a loud buzz
keep_pcm=1
; engine = the PC executable's Doppler speeds (measured every frame; default); wii = measured over at least one Wii
; frame (1/doppler_rate s of game time), jumps of a new sound to its object ignored.  doppler_log=1 logs the sound
; sources, their Doppler, the ADPCM decoding and the DirectSound calls once per second (diagnostics)
doppler=engine
doppler_rate=60
doppler_log=0

[script]
; 1 = these script natives answer like on the Wii (0 = the PC executable's own answers); with 1 the IO_File natives
;     never open a file either (the Wii's go to the development kit only)
enabled=1
; what ViD_PlatformCurrentGet tells the scripts: wii (1), pc (0), or auto = wii with the virtual Wii remote
; ([controls] mode=wii: the rabbids use the Wii control type), pc with mode=pc (the scripts' own PC controls)
platform=auto
; 1 = IO_JoystickPointerStateSet works: the scripts switch the pointer off during videos and cinematics
pointer_state=1
; WII_ReturnToMenu (the Home menu's "Wii Menu"): quit = close the game, none = do nothing
return_to_menu=quit

[options]
; 1 = the OPTIONS screen of the pause menu: control bindings (with [controls] mode=pc), volumes and graphics (display
;     mode, window size, VSync, high detail, texture filtering, Wii effects), saved in options.ini next to the DLL.
;     0 = no Options screen, bindings, volumes or graphics settings
enabled=1

[mods]
; 1 = the mods the launcher enabled (options.ini [mods] enabled=a|b) are read from the game folder: mods\<mod>\entries
;     (whole archive entries: bins or loose files named by key or file name) and mods\<mod>\records (records of the
;     world packages named by key).  The archive itself is never changed.  0 = mods off
enabled=1
; 1 = the enabled mods' main.lua scripts run (Lua 5.4, the wc table: see docs/platform.md)
lua=1
; 1 = what the loader serves and what the scripts log go to wiimote_log.txt (with [general] log=1)
log=1

[pointer]
; IR pointer from the mouse inside the game window (valid while inside)
mouse=1
; IR pointer moved by the pad's right stick (stays valid)
pad_stick=1
; screen widths per second at full deflection
pad_speed=1.4
; distance to the sensor bar in metres (0.8..2.9)
dist=2.0
; what WPADGetSensorBarPosition reports: 0 below the TV, 1 above
sensor_bar=0
; KPAD's pointer centre: auto (read from the engine), 0.2 or -0.2
kpad_center_y=auto

[motion]
; shake gesture: peak acceleration in g and frequency while the shake input is held
shake_g=3.0
shake_hz=6.0
; remote, nunchuk or both
shake_target=remote
; roll angle of the tilt keys and how fast it is reached
tilt_deg=35
tilt_speed_deg=90

[keys]
A=SPACE,RETURN,LBUTTON
B=LSHIFT,RBUTTON
Z=LCONTROL
C=C
1=1
2=2
PLUS=TAB
MINUS=ESCAPE
HOME=H
DUP=I,NUMPAD8
DDOWN=K,NUMPAD2
DLEFT=J,NUMPAD4
DRIGHT=L,NUMPAD6
STICK_UP=W,UP
STICK_DOWN=S,DOWN
STICK_LEFT=A,LEFT
STICK_RIGHT=D,RIGHT
SHAKE=F,MBUTTON
TILT_LEFT=Q
TILT_RIGHT=E
POINTER_CENTER=
CONNECT_TOGGLE=

[xinput]
enabled=1
; -1 = first connected pad, else 0..3
pad=-1
deadzone=0.25
A=A
B=B,RT
Z=LT
C=LB
1=RB
2=Y
PLUS=START
MINUS=BACK
HOME=RS
DUP=DUP
DDOWN=DDOWN
DLEFT=DLEFT
DRIGHT=DRIGHT
SHAKE=X
POINTER_CENTER=LS

; Mods keep their own settings in their own folder (mods\<mod>\config.ini), not here: this file is the
; platform's.  Mario, for one, reads mods\It's a me!\config.ini and finds his ROM there.
